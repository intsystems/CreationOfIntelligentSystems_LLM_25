# Model configuration
model:
  name: "Qwen/Qwen2.5-3B"
  
  torch_dtype: "bfloat16"  # bfloat16, float16, float32
  device_map: "auto"
  cache_dir: "/home/jovyan/shares/SR008.fs2/nkiselev/sandbox/vmeshkov/dim_lm/CreationOfIntelligentSystems_LLM_25/cache"
  token: null  # HuggingFace token if needed
  use_bloom: false  # true for BLOOM models, false for LLaMA/Qwen

# Dataset configuration
dataset:
  name: "glue"
  subset: "qqp"
  split: "train"
  cache_dir: "/home/jovyan/shares/SR008.fs2/nkiselev/sandbox/vmeshkov/dim_lm/CreationOfIntelligentSystems_LLM_25/data"
  max_length: 512
  
# Processing configuration
processing:
  batch_size: 96
  num_workers: 4
  shuffle: false

# Output configuration
output:
  base_dir: "activation_saved/activations_qqp"
  model_subdir: "qwen2.5-3b"  # Subdirectory name for this model
  save_dtype: "float16"  # float16, float32
  
# Activation aggregation
aggregation:
  method: "mean"  # mean, sum, last, none
  use_attention_mask: true